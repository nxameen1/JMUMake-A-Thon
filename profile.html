<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acorn — Create Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell" id="profile-page">
    <h1 id="profile-title">Profile</h1>
    <hr>
    <img id="avatar" src="imgs/sam-cute.png" alt="pic of a squirrel">
    <h1 id="student-name">Student Name</h1>
    <p id="school">James Madison</p>
    <p id="joined">Joined Nov 14 2026</p>
    <p id="friend-count">0 friends</p>
    <hr>
    <h1 id="events-heading">Events</h1>
    <div id="events-card">
        <p>input an events card</p>
    </div>
    <hr>
    <h1 id="friends-heading">Friends</h1>
    <!--profile pictures-->
    <ul class="teamList">
        <li class="teamMember">
            <img class="friend-avatar" src="imgs/sam-cute.png" alt="">
            <p class="friend-name">Friend name yap</p>
        </li>
        <li class="teamMember">
            <img class="friend-avatar" src="imgs/sam-cute.png" alt="">
            <p class="friend-name">Friend name yap</p>
        </li>
        <li class="teamMember">
            <img class="friend-avatar" src="imgs/sam-cute.png" alt="">
            <p class="friend-name">Friend name yap</p>
        </li>
    </ul>
    </main>
</body>
</html>
