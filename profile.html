<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acorn — Create Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .avatar-link {
            position: relative;
            display: block;
            width: 120px;
            height: 120px;
            margin: 0 auto 14px;
            overflow: hidden;
            border: 4px solid var(--white);
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 0 3px var(--terracotta), var(--shadow);
        }

        #avatar {
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            border-radius: 0;
            object-fit: contain;
            background: transparent;
            box-shadow: none;
        }

        #avatar-accessory {
            position: absolute;
            display: none;
            object-fit: contain;
            filter: drop-shadow(0 1px 1px rgb(51 47 46 / 18%));
        }

        #avatar-accessory.show {
            display: block;
        }

        #avatar-accessory.hat {
            top: 10%;
            left: 36%;
            width: 38%;
            height: 27%;
        }

        #avatar-accessory.russian-hat {
            top: 10%;
            left: 37%;
            width: 38%;
            height: 45%;
        }

        #avatar-accessory.ears {
            top: 1%;
            left: 39%;
            width: 36%;
            height: 35%;
        }

        #avatar-accessory.shorts {
            top: 55%;
            left: 36%;
            width: 39%;
            height: 30%;
        }
    </style>
</head>

<body>
    <main class="app-shell" id="profile-page">
        <header class="topbar">
            <a class="back" href="home.html" aria-label="Back to home">‹</a>
            <h1 id="profile-title">Profile</h1>
        </header>
        <hr>
        <section class="welcome" aria-labelledby="welcome-heading">
            <a class="avatar-link" href="squirrel.html" aria-label="Customize squirrel">
                <img id="avatar" src="imgs/sam-cute.png" alt="pic of a squirrel">
                <img id="avatar-accessory" src="" alt="">
            </a>
            <h1 id="student-name">Ella</h1>
            <p id="school">James Madison University</p>
            <p id="joined">Joined Nov 14 2026</p>
            <p id="friend-count">0 friends</p>
            <hr>
        </section>
        <h1 id="events-heading">Your Events</h1>
        <div id="events-card">
            <p class="event-time"><time datetime="16:30">TODAY · 4:30 PM</time> · ROSE LIBRARY</p>
            <h2 id="game-title">Help clean up outside Rose</h2>
            <p class="game-description">Grab a bag and join a small group cleaning up the lawn.</p>
            <div class="game-footer">
                <span class="going">
                    <span class="people-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span>5 going</span>
                </span>
                <a class="game-link" href="./game-project-joined/index.html">more info</a>
            </div>
        </div>
        <hr>
        <h1 id="friends-heading">Friends</h1>
        <!--profile pictures-->
        <ul class="teamList">
            <li class="teamMember">
                <img class="friend-avatar" src="imgs/sam-cute.png" alt="">
                <p class="friend-name">Complete a game to branch out and make friends!</p>
            </li>
        </ul>
    </main>
    <script>
        try {
            const savedSquirrel = JSON.parse(localStorage.getItem('customizedSquirrel') || 'null');
            if (savedSquirrel?.equipped) {
                const accessory = document.querySelector('#avatar-accessory');
                accessory.src = `imgs/${savedSquirrel.equipped.image}`;
                accessory.className = `show ${savedSquirrel.equipped.kind}`;
                document.querySelector('#avatar').alt = `Squirrel wearing ${savedSquirrel.equipped.name}`;
            }
        } catch { }
    </script>
</body>

</html>
