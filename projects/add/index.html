<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2e8d0">
    <link rel="manifest" href="/manifest.json" />
    <title>Start a project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="../../project-detail/styles.css" />
    <style>
        .signin-card textarea {
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            min-height: 96px;
            padding: 12px 14px;
            border: 2px solid var(--line);
            border-radius: 14px;
            color: var(--ink);
            background: var(--white);
            resize: vertical;
        }

        .signin-card textarea:focus-visible {
            outline: 3px solid #a98ab8;
            outline-offset: 2px;
        }

        .signin-card {
            margin: 0;
        }

        .app-shell .addMember {
            margin: 0;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 17px;
            border: 2px dashed var(--line);
            border-radius: 21px;
            color: var(--purple);
            background: transparent;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="app-shell">
        <header class="topbar">
            <a class="icon-button" href="../../projects.html" aria-label="Back to previous page" data-history-back>
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
            </a>

            <p class="greeting">New project</p>

            <span></span>
        </header>

        <form id="new-project" action="../../project-detail/index.html" method="get">
            <main id="main-content">
                <section class="welcome" aria-labelledby="page-title">
                    <p class="greeting">Have an idea?</p>
                    <h1 id="page-title">Start a project</h1>
                </section>

                <div class="projectInfo">
                    <img class="projectImage" alt="Project image placeholder"
                        src="https://placehold.co/1200x675/ebdfc4/8c4c1f?text=Project+Image" />

                    <div class="signin-card">
                        <label for="project-title">Project title</label>
                        <input id="project-title" name="title" type="text" placeholder="Project title" required />

                        <label for="project-description">Description</label>
                        <textarea id="project-description" name="description"
                            placeholder="Describe your project and who you need" required></textarea>

                        <label for="project-max">Max group size</label>
                        <input id="project-max" name="max" type="number" min="1" max="12" placeholder="e.g. 4"
                            required />
                    </div>

                    <h2 class="section-divider">Group Members</h2>
                    <ul class="teamList">
                        <li class="teamMember">
                            <img class="memberAvatar"
                                src="https://static.coasterfan5.com/makeathon/Screenshot%202026-11-14%20at%203.54.54%E2%80%AFPM.png"
                                alt="Ella profile picture" />
                            <div class="memberInfo">
                                <p class="memberName">Ella</p>
                                <p class="memberMajor">Computer Science · Creator</p>
                            </div>
                        </li>
                        <li>
                            <button class="addMember" type="button">+ Invite a teammate</button>
                        </li>
                    </ul>
                </div>
            </main>

            <div class="joinButton">
                <button type="submit">Publish project</button>
            </div>
        </form>
    </div>
</body>

</html>
