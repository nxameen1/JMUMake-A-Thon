<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acorn — Create Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Activity detail and sign-up page placeholder. -->
   <main class="app-shell">
    <div>

        <header>
            <a class="back" href="home.html" aria-label="Back to home">‹</a>
            <h1>Tell us about yourself!</h1>
        </header>
        <div id="interests">
            <p>Choose at least 3 things to help find events that are interesting to you</p>
            <hr>
            <p>Interests</p>
            <label>
                <input type="checkbox">
                Volunteering
            </label>
            <label>
                <input type="checkbox">
                Art and design
            </label>
            <label>
                <input type="checkbox">
                Writing
            </label>
            <label>
                <input type="checkbox">
                Tech and coding
            </label>
            <label>
                <input type="checkbox">
                History
            </label>
            <label>
                <input type="checkbox">
                Nature and outdoors
            </label>
            <label>
                <input type="checkbox">
                Animals
            </label>
            <label>
                <input type="checkbox">
                Cooking
            </label>
            <label>
                <input type="checkbox">
                Sports and fitness
            </label>
            <label>
                <input type="checkbox">
                Teaching and tutoring
            </label>
            <label>
                <input type="checkbox">
                Community events
            </label>
            <label>
                <input type="checkbox">
                Photography and video
            </label>
            <label>
                <input type="checkbox">
                Sports
            </label>
            <label>
                <input type="checkbox">
                DIY tasks
            </label>
            <label>
                <input type="checkbox">
                Music
            </label>
            <label>
                <input type="checkbox">
                Movies
            </label>
            <label>
                <input type="checkbox">
                Baking
            </label>
            <label>
                <input type="checkbox">
                Cooking
            </label>
            <label>
                <input type="checkbox">
                Organizing
            </label>

            <button type="button" id="next1">Next</button>
        </div>
        <div id="major" hidden>
            <p>What is your grade level?</p>
            <label>
                <input type="radio" name="grade">
                Freshman
            </label>
            <label>
                <input type="radio" name="grade">
                Sophomore
            </label>
            <label>
                <input type="radio" name="grade">
                Junior
            </label>
            <label>
                <input type="radio" name="grade">
                Senior
            </label>
            <hr>
            <p>Comfort level</p>
            <label>
                <input type="radio" name="comfort">
                Ease me in
            </label>
            <label>
                <input type="radio" name="comfort">
                I am up for most things
            </label>
            <label>
                <input type="radio" name="comfort">
                Throw me in the deep end
            </label>
            <hr>
            <p>Availability</p>
            <label>
                <input type="checkbox">
                One-time events
            </label>
            <label>
                <input type="checkbox">
                A few hours a week
            </label>
            <label>
                <input type="checkbox">
                Long-term projects
            </label>
            <hr>
            <p>What is your major</p>
            <label>
                <input type="text">
                Major
            </label>
            <button type="submit" id="next2">Next</button>
        </div>
        <div id="pref" hidden>
            <p>What is your transportation preference?</p>
            <label>
                <input type="checkbox">
                On campus
            </label>
            <label>
                <input type="checkbox">
                Off campus
            </label>
            <hr>
            <p>Do you need transportation?</p>
            <label>
                <input type="checkbox">
                I have a car and am willing to provide transportation for others.
            </label>
            <label>
                <input type="checkbox">
                I have a car and am not willing to provide transportation for others.
            </label>
            <label>
                <input type="checkbox">
                I do not have a car and need transportation.
            </label>
            <label>
                <input type="checkbox">
                I do not need transportation
            </label>
            <button type="submit" id="next3">Next</button>
        </div>
        <div id="complete" hidden>
            <section class="welcome" aria-labelledby="welcome-heading"></section>
            <h1>You're all set!</h1>
            <img src="imgs/sam-cute.png" alt="sam!">
            <a href="home.html" id="next4">Next</a>
        </div>

    </div>
   </main>
   <script>
    const next1 = document.getElementById("next1");
    const next2 = document.getElementById("next2");
    const next3 = document.getElementById("next3");
    const interests = document.getElementById("interests");
    const major = document.getElementById("major");
    const pref = document.getElementById("pref");
    const complete = document.getElementById("complete");

    next1.addEventListener("click", function(event){
        event.preventDefault(); // IMPORTANT!
        interests.hidden = true;
        major.hidden = false;
    });
    next2.addEventListener("click", function(event){
        event.preventDefault(); // IMPORTANT!
        major.hidden = true;
        pref.hidden = false;
    });
    next3.addEventListener("click", function(event){
        event.preventDefault(); // IMPORTANT!
        pref.hidden = true;
        complete.hidden = false;
    });

    document.querySelectorAll("input[type=radio]").forEach(radio => {
        radio.addEventListener("click", () => {
            if (radio.wasChecked) {
            radio.checked = false;
            radio.wasChecked = false;
            } else {
            document.querySelectorAll(`input[name="${radio.name}"]`)
                .forEach(r => r.wasChecked = false);
            radio.wasChecked = true;
            }
        });
    });

   </script>

</body>
</html>
