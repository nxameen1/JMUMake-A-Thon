<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acorn — Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- JMU student sign-in page placeholder. -->
   <main class="app-shell signin-shell">
    <div class="welcome">
      <h1 class="welcome-heading">Sign in through your JMU account</h1>
    <form class="signin-card" action="bio.html">
      <label for="user">JMU eID</label>
      <input type="text" name="user" id="user" placeholder="e.g. doejd" autocomplete="username">

      <label for="pass">Password</label>
      <input type="password" name="pass" id="pass" placeholder="••••••••" autocomplete="current-password">

      <!--button type="submit" data-bs-toggle="modal" data-bs-target="#signinPop">Submit</button!-->
      <a class="signin-btn" href="bio.html">Sign In</a>
    </form>
    </div>
   </main>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>
</html>
