<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ead8c2">
  <title>Acorn — JMU student community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .customizer { width:min(100%, 430px); min-height:calc(100vh - 56px); padding:20px 20px 28px; }
    .customizer .topbar { grid-template-columns:48px 1fr auto; padding:0 0 18px; gap:12px; }
    .back { width:48px;height:48px;display:grid;place-items:center;border-radius:17px;background:var(--purple-soft);color:var(--purple);font-size:25px;font-weight:900;text-decoration:none; }
    .page-title { margin:0;text-align:center;font-size:19px;font-weight:900;letter-spacing:-.4px; }
    .customizer .acorn-count { min-height:46px; }
    .stage { position:relative;min-height:378px;overflow:hidden;padding:20px;border:1.5px solid #d09b64;border-radius:23px;background:#ead4bf;box-shadow:0 5px 0 #dfc2a3; }
    .stage::before { position:absolute;top:0;left:50%;width:56px;height:13px;content:"";background:#f4cd78;transform:translateX(-50%) rotate(-2deg); }
    .stage-heading { position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px; }
    .hand-name { margin:0;color:#795b50;font:600 22px Caveat,cursive; }
    .equipped-label { color:#754a34;font-size:12px;font-weight:900;text-align:right; }
    .squirrel-wrap { position:relative;display:grid;place-items:center;height:295px; }
    .ground { position:absolute;bottom:10px;width:60%;height:40px;border-radius:50%;background:#dfc09f; }
    .squirrel { position:relative;z-index:1;width:250px;height:246px;display:grid;place-items:center; }
    .squirrel-base {width:100%;height:auto;object-fit:contain;}
    .equipped-preview {position:absolute;display:none;object-fit:contain;filter:drop-shadow(0 2px 1px rgb(51 47 46 / 12%));}
    .equipped-preview.show {display:block}
    .equipped-preview.hat {top:10%;left:36%;width:38%;height:27%;}
    .equipped-preview.russian-hat {top:10%;left:37%;width:38%;height:45%;}
    .equipped-preview.ears {top:1%;left:39%;width:36%;height:35%;}
    .equipped-preview.shorts {top:55%;left:36%;width:39%;height:30%;}
    .tabs {display:flex;justify-content:center;margin-top:19px;border-bottom:1px solid var(--line);}
    .tab {min-width:112px;padding:10px 22px 8px;border:0;border-bottom:2px solid transparent;border-radius:12px 12px 0 0;color:#927f87;background:transparent;font-size:14px;font-weight:900;text-transform:lowercase;cursor:pointer;}
    .app-shell .tab {display:block;flex:none;margin:0;padding:10px 22px 8px;border-radius:12px 12px 0 0;background:transparent;box-shadow:none;color:#927f87;}
    .tab[aria-selected="true"] {border-bottom-color:#fffdfa;color:#754a34;background:#fffdfa}
    .app-shell .tab[aria-selected="true"] {background:#fffdfa;color:#754a34;}
    .item-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 12px;padding:16px 0 24px;}
    .item {min-width:0;text-align:center;}
    .item-card {position:relative;width:100%;aspect-ratio:1.16;display:grid;place-items:center;border:1.5px solid rgb(117 74 52 / 12%);border-radius:18px;background:#f5dfb6;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;}
    .app-shell .item-card {display:grid;flex:none;place-items:center;margin:0;padding:0;color:inherit;background:#f5dfb6;box-shadow:none;}
    .item:first-child .item-card {background:#ead4bf;}
    .item:nth-child(3n+2) .item-card {background:#ead4bf}.item:nth-child(3n) .item-card {background:#f1d9c1}.item:nth-child(4n) .item-card {background:#e1c6aa}
    .item-card:hover {transform:translateY(-3px)}
    .item-card.selected {border:2px solid #fffdfa;background:#ead4bf;box-shadow:0 3px 0 #c79767;}
    .app-shell .item-card.selected {background:#ead4bf;box-shadow:0 3px 0 #c79767;}
    .item-card:focus-visible,.tab:focus-visible,.back:focus-visible {outline:3px solid #754a34;outline-offset:3px}
    .item-art {display:block;width:67%;height:70%;margin:auto;object-fit:contain;object-position:center;}
    .on-badge {position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:99px;color:#754a34;background:#fffdfa;font-size:9px;font-weight:900;text-transform:uppercase;}
    .item-name {margin:7px 0 3px;font-size:11px;font-weight:900;line-height:1.2;}
    .price {display:inline-flex;align-items:center;gap:5px;color:#754a34;font-size:12px;font-weight:900;}
    .price .acorn-icon {transform:scale(.8)}
    .hint {margin:0;padding:17px 0 0;border-top:1px solid var(--line);color:#927487;text-align:center;font:600 18px Caveat,cursive;}
    .sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:420px) {body{padding:12px 8px}.customizer{min-height:calc(100vh - 24px);padding:16px}.stage{min-height:320px}.squirrel-wrap{height:250px}.item-grid{gap:15px 8px}.item-card{border-radius:17px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app-shell customizer">
    <header class="topbar">
      <a class="back" href="profile.html" aria-label="Back to home">‹</a>
      <h1 class="page-title">customize squirrel</h1>
      <div class="acorn-count" aria-label="240 acorns"><span class="acorn-icon" aria-hidden="true"></span><span id="balance">240</span></div>
    </header>
    <section class="stage" aria-label="Squirrel preview">
      <div class="stage-heading"><p class="hand-name">Student’s squirrel</p><span class="equipped-label" id="equipped-label">choose an item</span></div>
      <div class="squirrel-wrap" role="img" aria-label="Squirrel customization preview">
        <div class="ground"></div><div class="squirrel">
          <img class="squirrel-base" src="imgs/sam-cute.png" alt="">
          <img class="equipped-preview hat" id="equipped-preview" src="" alt="">
        </div>
      </div>
    </section>
    <div class="tabs" role="tablist" aria-label="Hat accessories">
      <button class="tab" role="tab" id="tab-hats" aria-selected="true" aria-controls="item-grid" data-category="hats">hats</button>
    </div>
    <section class="item-grid" id="item-grid" role="tabpanel" aria-labelledby="tab-hats"></section>
    <p class="hint">more little hats unlock as you branch out</p>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>
  <script>
    const catalog = {
      hats: [
        {name:'Russian hat',image:'russina-removebg-preview.png',kind:'russian-hat',cost:40},
        {name:'blue cap',image:'blue_cap-removebg-preview.png',kind:'hat',cost:45},
        {name:'red hat',image:'red_hat-removebg-preview.png',kind:'hat',cost:50},
        {name:'bunny ears',image:'bunny_ears-removebg-preview.png',kind:'ears',cost:35},
        {name:'green shorts',image:'green_shorts-removebg-preview.png',kind:'shorts',cost:60}
      ]
    };
    let savedSquirrel = null;
    try { savedSquirrel = JSON.parse(localStorage.getItem('customizedSquirrel') || 'null'); } catch {}
    let balance = savedSquirrel?.balance ?? 240;
    let equipped = savedSquirrel?.equipped?.name ?? null;
    if (savedSquirrel?.owned) {
      catalog.hats.forEach(item => { item.owned = savedSquirrel.owned.includes(item.name); });
    }
    const grid = document.querySelector('#item-grid');
    const balanceEl = document.querySelector('#balance');
    const status = document.querySelector('#status');
    function render(category) {
      document.querySelectorAll('.tab').forEach(tab => {
        const active = tab.dataset.category === category;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      grid.setAttribute('aria-labelledby', `tab-${category}`);
      grid.innerHTML = catalog[category].map(item => {
        const selected = item.name === equipped;
        const unavailable = !item.owned && balance < item.cost;
        return `<article class="item"><button class="item-card${selected ? ' selected' : ''}" type="button" data-name="${item.name}" data-image="${item.image}" data-kind="${item.kind}" data-cost="${item.cost}" data-owned="${Boolean(item.owned)}" aria-pressed="${selected}" ${unavailable ? 'disabled' : ''} aria-label="${item.name}, ${selected ? 'equipped' : item.owned ? 'owned' : `${item.cost} acorns`}">${selected ? '<span class="on-badge">on</span>' : ''}<img class="item-art" src="imgs/${item.image}" alt=""></button><p class="item-name">${item.name}</p><span class="price">${item.owned ? 'owned' : `<span class="acorn-icon" aria-hidden="true"></span>${item.cost}`}</span></article>`;
      }).join('');
    }
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => render(tab.dataset.category)));
    grid.addEventListener('click', event => {
      const button = event.target.closest('.item-card'); if (!button) return;
      const name = button.dataset.name; const cost = Number(button.dataset.cost);
      if (button.dataset.owned !== 'true') { balance -= cost; balanceEl.textContent = balance; }
      const item = Object.values(catalog).flat().find(entry => entry.name === name);
      item.owned = true; equipped = name;
      document.querySelector('#equipped-label').textContent = `${name} on`;
      const preview = document.querySelector('#equipped-preview');
      preview.src = `imgs/${item.image}`;
      preview.className = `equipped-preview show ${item.kind}`;
      const stage = document.querySelector('.stage'); stage.querySelector('.squirrel-wrap').setAttribute('aria-label', `Squirrel wearing ${name}`);
      localStorage.setItem('customizedSquirrel', JSON.stringify({
        balance,
        equipped: { name: item.name, image: item.image, kind: item.kind },
        owned: catalog.hats.filter(entry => entry.owned).map(entry => entry.name)
      }));
      render(document.querySelector('.tab[aria-selected="true"]').dataset.category);
      status.textContent = `${name} equipped${button.dataset.owned === 'true' ? '' : ` for ${cost} acorns`}. ${balance} acorns remaining.`;
    });
    if (savedSquirrel?.equipped) {
      const item = savedSquirrel.equipped;
      const preview = document.querySelector('#equipped-preview');
      preview.src = `imgs/${item.image}`;
      preview.className = `equipped-preview show ${item.kind}`;
      document.querySelector('#equipped-label').textContent = `${item.name} on`;
      document.querySelector('.squirrel-wrap').setAttribute('aria-label', `Squirrel wearing ${item.name}`);
    }
    balanceEl.textContent = balance;
    render('hats');
  </script>
</body>
</html>
